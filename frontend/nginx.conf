server {
    listen 80;
    root /usr/share/nginx/html;

    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;

    # Only these two paths reach the backend. /livez is deliberately not forwarded.
    location = /healthz {
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    # A missing build file is a real 404, not the app page.
    location /assets/ {
        try_files $uri =404;
    }

    # Everything else serves the React app, so refreshing /game/:id works.
    location / {
        try_files $uri /index.html;
    }
}
