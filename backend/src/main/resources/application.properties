spring.application.name=connectfour

# 8081 on the host leaves 8080 for kind. The Docker image overrides this with SERVER_PORT=8080.
server.port=8081

# Defaults match the development database in compose.yaml.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/connectfour}
spring.datasource.username=${DATABASE_USER:connectfour}
spring.datasource.password=${DATABASE_PASSWORD:connectfour}

# Fail quickly when Postgres is unreachable, so /healthz answers within the readiness probe's timeout.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=10
